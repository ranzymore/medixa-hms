# Copy to /etc/nginx/sites-available/medixa, symlink into sites-enabled, then:
#   certbot --nginx -d hpos.wavesoms.com -d hpos-staging.wavesoms.com
# (certbot adds the listen 443 / ssl lines and the http->https redirect)

map $http_upgrade $medixa_connection { default upgrade; '' ''; }

# Medixa HMS - production
server {
    server_name hpos.wavesoms.com;
    client_max_body_size 50M;
    location / {
        proxy_pass http://127.0.0.1:3310;
        include /etc/nginx/snippets/medixa-proxy.conf;
    }
    listen 80;
}

# Medixa HMS - staging
server {
    server_name hpos-staging.wavesoms.com;
    client_max_body_size 50M;
    location / {
        proxy_pass http://127.0.0.1:3311;
        include /etc/nginx/snippets/medixa-proxy.conf;
    }
    listen 80;
}
