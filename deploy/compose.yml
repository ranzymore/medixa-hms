# One stack per environment, e.g.:
#   APP_ENV=staging APP_PORT=3301 docker compose -f compose.yml -p medixa-staging up -d
# Secrets (POSTGRES_PASSWORD, SECRET_KEY, DEMO_PASSWORD) come from the deploy job's env.
services:
  db:
    image: postgres:17-alpine
    container_name: medixa-db-${APP_ENV}
    restart: always
    environment:
      POSTGRES_USER: medixa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: hms
      DEMO_PASSWORD: ${DEMO_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when pgdata is empty (first boot): restore demo dump, baseline migrations.
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medixa -d hms"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/ranzymore/medixa-hms:${IMAGE_TAG:-${APP_ENV}}
    container_name: medixa-app-${APP_ENV}
    restart: always
    ports:
      - "127.0.0.1:${APP_PORT:?}:3000"
    environment:
      DATABASE_URL: postgresql://medixa:${POSTGRES_PASSWORD}@db:5432/hms
      DATABASE_SSL: "false"
      secret_key: ${SECRET_KEY:?}
      TZ: Asia/Karachi
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
