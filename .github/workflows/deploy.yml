name: CI/CD

# staging branch -> medixa-staging.wavesoms.com, main branch -> medixa.wavesoms.com
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ranzymore/medixa-hms
  APP_ENV: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.29.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  build:
    name: Build & push image
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.APP_ENV }}
            ${{ env.IMAGE }}:${{ env.APP_ENV }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ env.APP_ENV }}
          cache-to: type=gha,mode=max,scope=${{ env.APP_ENV }}

  deploy:
    name: Deploy to Atmos VPS
    needs: build
    runs-on: self-hosted
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: https://${{ github.ref_name == 'main' && 'medixa' || 'medixa-staging' }}.wavesoms.com
    env:
      APP_PORT: ${{ github.ref_name == 'main' && '3300' || '3301' }}
      DIR: /home/github/medixa/${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync stack files
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          mkdir -p "$DIR"
          cp deploy/compose.yml "$DIR/"
          rm -rf "$DIR/initdb" "$DIR/migrations"
          cp -r deploy/initdb "$DIR/initdb"
          cp "$(ls db/dump/*.sql | sort | tail -1)" "$DIR/initdb/10-dump.sql"
          cp -r database/migrations "$DIR/migrations"
          umask 077
          printf '%s\n' \
            "APP_ENV=$APP_ENV" \
            "APP_PORT=$APP_PORT" \
            "IMAGE_TAG=$APP_ENV-$GITHUB_SHA" \
            "POSTGRES_PASSWORD='$POSTGRES_PASSWORD'" \
            "SECRET_KEY='$SECRET_KEY'" \
            "DEMO_PASSWORD='$DEMO_PASSWORD'" > "$DIR/.env"

      - name: Pull & start
        working-directory: ${{ env.DIR }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose -p medixa-$APP_ENV pull app
          docker compose -p medixa-$APP_ENV up -d --wait db
          sh "$GITHUB_WORKSPACE/deploy/migrate.sh" medixa-db-$APP_ENV
          docker compose -p medixa-$APP_ENV up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:$APP_PORT/" && echo "healthy" && exit 0
            sleep 3
          done
          docker logs --tail 80 medixa-app-$APP_ENV
          exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
